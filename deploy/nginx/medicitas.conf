# ============================================================================
# MediCitas — nginx (SPA + API + uploads en el mismo dominio)
#
# Instalación (una sola vez):
#   sudo cp deploy/nginx/medicitas.conf /etc/nginx/sites-available/medicitas
#   sudo ln -sf /etc/nginx/sites-available/medicitas /etc/nginx/sites-enabled/medicitas
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ajusta server_name y root a tu dominio/ruta reales. El backend debe estar
# escuchando en 127.0.0.1:4000 (PORT en backend/src/.env).
# ============================================================================

server {
    listen 80;
    server_name _;

    # Build de Vite copiado por deploy/deploy.sh
    root /var/www/medicitas;
    index index.html;

    # Fotos de perfil/médicos (multer). Ajusta si subes archivos más grandes.
    client_max_body_size 12m;

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── API ──────────────────────────────────────────────────────────────────
    # Sin slash final en proxy_pass: conserva /api/... tal cual.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Uploads ──────────────────────────────────────────────────────────────
    # El backend los sirve con express.static; nginx cachea la respuesta.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
    }

    # ── Assets con hash de Vite ──────────────────────────────────────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # React Router: cualquier ruta que no sea un archivo se resuelve con
    # index.html. Las rutas /api y /uploads ya se capturaron arriba.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html no se cachea para que un despliegue nuevo se vea de inmediato.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store";
    }

    # Compresión de texto (si nginx no la tiene activada globalmente)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;
}
